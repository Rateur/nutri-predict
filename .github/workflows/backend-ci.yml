name: Backend CI

on:
  push:
    branches: [ "main", "bloc-2-ai-research" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy
          pip install -r backend/requirements.txt

      - name: Linting (flake8)
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Type Checking (mypy)
        run: mypy backend/app --ignore-missing-imports --no-error-summary || true

  test-backend-api:
    name: Backend Tests
    needs: lint
    runs-on: ubuntu-latest

    env:
      PROJECT_NAME: "NutriPredict-Test"
      DATABASE_URL: "postgresql+asyncpg://postgres:password@localhost:5432/test_db"
      POSTGRES_SERVER: "localhost"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "test_db"
      API_KEY: "ci_test_key"
      ALLOWED_ORIGINS: "*"
      PYTHONPATH: backend

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate a throwaway encryption key
        run: echo "ENCRYPTION_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: pytest backend/tests/ -v --tb=short

  test-ml-performance:
    name: ML Model Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas joblib "scikit-learn>=1.5.0" pyarrow

      - name: Run ML Performance Evaluation
        run: PYTHONPATH=. pytest research/scripts/test_model_performance.py -v
